<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Don Omar - Iniciar sesión</title>
</head>
<body>
    <header>
        <div class="marca">
            <a href="./index.html">
                <img src="./img/logo.jpg" alt="Logo de Don Omar" class="logo">
            </a>
            <h1><a href="./index.html" class="donOmar">Don Omar</a></h1>
        </div>

        <nav class="nav-1">
            <ul class="menu">
                <li><a href="./index.html" class="bar">Home</a></li>
                <li id="item-login"><a href="./login.html" class="bar">Iniciar sesión</a></li>
                <li id="item-registro"><a href="./register.html" class="bar">Registrarse</a></li>
                <li id="item-logout" class="oculto"><a href="#" class="bar">Logout</a></li>
            </ul>
        </nav>

        <p class="saludo" id="saludo"></p>

        <form action="./search-results.html" method="GET" class="barra-busqueda" id="form-busqueda">
            <div>
                <label for="busqueda">Búsqueda: </label>
                <input id="busqueda" type="text" name="busqueda" value="">
            </div>
            <div>
                <button type="submit">Buscar</button>
            </div>
            <p class="error-formulario" id="error-busqueda"></p>
        </form>
    </header>

    <main>
        <aside>
            <nav class="nav-2">
                <ul class="category" id="lista-categorias">
                    <li><span class="lista-1">Categorías</span></li>
                </ul>
            </nav>
        </aside>

        <div class="contenido-principal">
            <form action="./index.html" method="get" class="formulario-login" id="form-login">
                <h2 class="titulo-login">Ingresar</h2>

                <div class="campo-formulario">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com">
                </div>

                <div class="campo-formulario">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="********">
                </div>

                <p class="error-formulario" id="error-login"></p>

                <button type="submit" class="boton-ingresar">Ingresar</button>

                <div class="enlace-registro-contenedor">
                    <a href="./register.html" class="enlace-registro">No tengo cuenta</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 - Don Omar</p>
        <p>Integrantes: Santiago Mordentti - Felipe Ibañez Beati</p>
    </footer>

    <script src="./js/categorias.js"></script>
    <script src="./js/buscador.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
