<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="utf-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Santi y  Uru </title>
</head>
<body>
    <header>
        <div class="marca">
            <img src="./img/logo.jpg" alt="Logo de Don Omar" class="logo">
            <h1 class="donOmar">Don Omar</h1>
        </div>
        <nav class="nav-1">
            <ul class="menu">
                <li><a href="home.html" class="bar"> Home</a></li>
                <li><a href="iniciar-sesion.html"class=" bar"> Inicar sesion</a></li>
                <li><a href="registrarse.html"class="bar"> Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-login">
        <div class="tarjeta-login">
            <h1 class="titulo-login">Iniciar sesion</h1>
        
        <form action="./index.html" method="get" class="formulario-login">
            <div class="campo-formulario">   
                <label for="email">Email: </label>
                <input type="email" name="email" id="email" placeholder="tu-email@ejemplo.com" required>
            </div>

            <div class="campo-formulario">
                <label for="password">Contraseña </label>
                <input id="password" type="password" name="password" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="boton-ingresar">ingresar</button>

            <div class="enlace-registro-contenedor">
                <a href="./registro.html">No tengo cuenta</a>
            </div>
        </form>
        </div>
    </main>
</body>
</html>
