<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Don Omar - Producto</title>   
</head>
<body>
    <header>
        <div class="marca">
            <a href="./index.html">
                <img src="./img/logo.jpg" alt="Logo de Don Omar" class="logo">
            </a>
            <h1><a href="./index.html" class="donOmar">Don Omar</a></h1>
        </div>

        <nav class="nav-1">
            <ul class="menu">
                <li><a href="./index.html" class="bar">Home</a></li>
                <li id="item-login"><a href="./login.html" class="bar">Iniciar sesión</a></li>
                <li id="item-registro"><a href="./register.html" class="bar">Registrarse</a></li>
                <li id="item-logout" class="oculto"><a href="#" class="bar">Logout</a></li>
            </ul>
        </nav>

        <p class="saludo" id="saludo"></p>

        <form action="./search-results.html" method="GET" class="barra-busqueda" id="form-busqueda">
            <div>
                <label for="busqueda">Búsqueda: </label>
                <input id="busqueda" type="text" name="busqueda" value="">
            </div>
            <div>
                <button type="submit">Buscar</button>
            </div>
            <p class="error-formulario" id="error-busqueda"></p>
        </form>
    </header>

    <main>
        <aside>
            <nav class="nav-2">
                <ul class="category" id="lista-categorias">
                    <li><span class="lista-1">Categorías</span></li>
                </ul>
            </nav>
        </aside>

        <div class="contenido">
            <section class="oso-1">
                <article class="oso-2">
                    <img class="porsche" id="producto-imagen" src="" alt="">
                    <ul class="panda-1">
                        <li><a href="#" id="producto-categoria">Categoría: </a></li>
                        <li><h2 id="producto-nombre"></h2></li>
                        <li><p id="producto-marca">Marca: </p></li>
                        <li><p id="producto-precio"></p></li>
                        <li><p id="producto-descripcion"></p></li>
                        <li><p id="producto-stock">Stock: </p></li>
                        <li><p id="producto-tags">Tags: </p></li>
                    </ul>
                </article>

                <h3 class="comentarios">Comentarios de compradores</h3>

                <article class="oso-3">
                    <ul class="panda-2" id="lista-reviews"></ul>
                </article>
            </section>
        </div>
    </main>

    <footer>
        <p>© 2026 - Don Omar</p>
        <p>Integrantes: Santiago Mordentti - Felipe Ibañez Beati</p>
    </footer>

    <script src="./js/categorias.js"></script>
    <script src="./js/buscador.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/product.js"></script>
</body>
</html>
